<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accueil - Atelier Mémo</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #F7F5F0;
    --text:     #1A1A2E;
    --muted:    #7A7A8C;
    --accent:   #E8704A;
    --surface:  #FFFFFF;
    --border:   #E2DFD8;

    /* couleurs par jeu */
    --c-simon:   #4A7CCC;
    --c-memory:  #7BAB5A;
    --c-quiz:    #C8813C;
    --c-taupe:   #CC4A72;
    --c-intrus:  #7A5ACC;
    --c-def:     #2E9E8F;
    --c-puzzle:  #C9A227;
    --c-anagramme: #C0453D;
    --c-mots:    #6B8E23;
    --c-puissance4: #8C1F3B;
    --c-rummikub: #A6763E;
    --c-casse:   #3D5A80;
   --c-lettres: #2E86AB;
  }

  html { font-size: 18px; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 0 0 48px;
  }

  /* ── Header ── */
  header {
    padding: 32px 24px 28px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }

  .header-inner {
    max-width: 480px;
    margin: 0 auto;
  }

  .logo-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 6px;
  }

  .logo-icon {
    width: 44px;
    height: 44px;
    flex-shrink: 0;
  }

  h1 {
    font-family: 'Lora', serif;
    font-size: 1.7rem;
    font-weight: 600;
    color: var(--accent);
    line-height: 1.1;
  }

  .tagline {
    font-size: 0.9rem;
    color: var(--muted);
    line-height: 1.5;
    margin-top: 4px;
  }

  /* ── Section ── */
  .section {
    max-width: 480px;
    margin: 0 auto;
    padding: 28px 20px 0;
  }

  .section-label {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 16px;
  }

  /* ── Cartes jeux ── */
  .game-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .game-card {
    background: var(--surface);
    border-radius: 20px;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 20px 20px;
    text-decoration: none;
    color: var(--text);
    cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
    -webkit-tap-highlight-color: transparent;
    position: relative;
    overflow: hidden;
  }

  .game-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 5px;
    border-radius: 20px 0 0 20px;
  }

  .game-card[data-color="memory"]::before { background: var(--c-memory); }
  .game-card[data-color="simon"]::before  { background: var(--c-simon); }
  .game-card[data-color="quiz"]::before   { background: var(--c-quiz); }
  .game-card[data-color="taupe"]::before  { background: var(--c-taupe); }
  .game-card[data-color="intrus"]::before { background: var(--c-intrus); }
  .game-card[data-color="def"]::before    { background: var(--c-def); }
  .game-card[data-color="puzzle"]::before { background: var(--c-puzzle); }
  .game-card[data-color="anagramme"]::before { background: var(--c-anagramme); }
  .game-card[data-color="mots"]::before { background: var(--c-mots); }
  .game-card[data-color="puissance4"]::before { background: var(--c-puissance4); }
  .game-card[data-color="rummikub"]::before { background: var(--c-rummikub); }
  .game-card[data-color="casse"]::before { background: var(--c-casse); }
 .game-card[data-color="lettres"]::before { background: var(--c-lettres); }

.tag-link {
  cursor: pointer;
  text-decoration: none;
  border-color: var(--c-lettres);
  color: var(--c-lettres);
  font-weight: 600;
}

  .game-card:active {
    transform: scale(0.98);
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  }

  .game-card.coming-soon {
    opacity: 0.00;
    cursor: default;
  }
  .game-card.coming-soon:active { transform: none; box-shadow: none; }

  .icon-wrap {
    width: 58px;
    height: 58px;
    border-radius: 16px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .game-card[data-color="memory"] .icon-wrap { background: #F0FAEB; }
  .game-card[data-color="simon"]  .icon-wrap { background: #EBF0FA; }
  .game-card[data-color="quiz"]   .icon-wrap { background: #FAF0E6; }
  .game-card[data-color="taupe"]  .icon-wrap { background: #FAEBF0; }
  .game-card[data-color="intrus"] .icon-wrap { background: #F0EBFA; }
  .game-card[data-color="def"]    .icon-wrap { background: #E6F5F3; }
  .game-card[data-color="puzzle"] .icon-wrap { background: #FAF3E0; }
  .game-card[data-color="anagramme"] .icon-wrap { background: #FBEAE8; }
  .game-card[data-color="mots"] .icon-wrap { background: #EEF3E3; }
  .game-card[data-color="puissance4"] .icon-wrap { background: #F5E6EA; }
  .game-card[data-color="rummikub"] .icon-wrap { background: #F6EEE2; }
  .game-card[data-color="casse"] .icon-wrap { background: #E8EEF5; }
 .game-card[data-color="lettres"] .icon-wrap { background: #E6F2F7; }


  .icon-wrap svg {
    width: 32px;
    height: 32px;
  }

  .game-info { flex: 1; }

  .game-name {
    font-family: 'Lora', serif;
    font-size: 1.1rem;
    font-weight: 600;
    line-height: 1.2;
    margin-bottom: 4px;
  }

  .game-desc {
    font-size: 0.82rem;
    color: var(--muted);
    line-height: 1.4;
  }

  .game-tags {
    display: flex;
    gap: 6px;
    margin-top: 8px;
    flex-wrap: wrap;
  }

  .tag {
    font-size: 0.68rem;
    font-weight: 500;
    letter-spacing: 0.04em;
    padding: 3px 9px;
    border-radius: 100px;
    border: 1px solid var(--border);
    color: var(--muted);
  }

  .badge-soon {
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 3px 10px;
    border-radius: 100px;
    background: var(--border);
    color: var(--muted);
    flex-shrink: 0;
    align-self: center;
  }

  .chevron {
    color: var(--border);
    flex-shrink: 0;
  }

  /* ── Footer ── */
  footer {
    max-width: 480px;
    margin: 40px auto 0;
    padding: 0 20px;
    text-align: center;
  }

  .footer-note {
    font-family: 'Lora', serif;
    font-style: italic;
    font-size: 0.78rem;
    color: var(--muted);
    opacity: 0.85;
    margin-bottom: 18px;
  }

  .creative-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 11px 22px;
    border-radius: 999px;
    background: linear-gradient(135deg, #F4A9C6, #EFC9DA);
    color: #7A2E4E;
    font-family: 'Lora', serif;
    font-weight: 600;
    font-size: 0.88rem;
    text-decoration: none;
    box-shadow: 0 4px 12px rgba(122, 46, 78, 0.22);
    transition: transform .15s ease, box-shadow .15s ease;
  }

  .creative-pill:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(122, 46, 78, 0.28);
  }

  .creative-pill:active { transform: translateY(0); }

  .footer-legal {
    margin-top: 18px;
    font-size: 0.7rem;
  }

  .footer-legal a {
    font-family: 'Lora', serif;
    color: var(--muted);
    text-decoration: none;
    letter-spacing: 0.02em;
    opacity: 0.65;
    border-bottom: 1px dotted var(--border);
    padding-bottom: 1px;
  }

  .footer-legal a:active { opacity: 1; }
</style>
</head>
