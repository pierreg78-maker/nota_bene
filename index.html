/* ================= Modal — socle commun ================= */
function closeModal(){$('#modalScrim').classList.add('hidden');$('#modalBox').innerHTML=''}
function showModal(){$('#modalScrim').classList.remove('hidden')}
function mkInput(ph,val,on){
  const i=el('input','f-in');i.placeholder=ph||'';i.value=val==null?'':val;
  i.oninput=()=>on(i.value);return i;
}
function mkField(lab,inp){
  const f=el('div','f-field');f.append(el('div','f-lab',lab),inp);return f;
}
function sampleValues(col){
  const v={};
  col.fields.forEach((f,i)=>{
    switch(f.type){
      case 'longtext':v[f.key]=i===0?'Un texte d\u2019exemple, sur plusieurs lignes si besoin.':'Détails d\u2019exemple…';break;
      case 'date':v[f.key]=todayISO();break;
      case 'number':v[f.key]=42;break;
      case 'rating':v[f.key]=4;break;
      case 'tags':v[f.key]='exemple, essai';break;
      case 'url':v[f.key]='https://exemple.fr';break;
      case 'check':v[f.key]=true;break;
      default:v[f.key]=i===0?'Exemple':'Valeur';
    }
  });
  return v;
}
function pvEntry(col,v){
  const d=el('div',col.paper?'pv-paper':'pv-mod');
  const f=col.fields,p0=f[0];
  const v0=String(v[p0.key]||'…');
  if(p0.type==='longtext')d.append(el('div','pv-qtext','« '+v0+' »'));
  else{
    const t=el('div','pv-term',v0);
    f.slice(1,4).filter(x=>x.type==='text'&&v[x.key]).forEach(x=>
      t.append(el('span','pv-sub',String(v[x.key]))));
    d.append(t);
  }
  const gf=f.find(x=>x.type==='text'&&x!==p0&&v[x.key]&&p0.type==='longtext');
  if(gf)d.append(el('div','pv-author',String(v[gf.key])));
  const sf=f.find(x=>x.type==='text'&&x!==p0&&x!==gf&&v[x.key]&&p0.type==='longtext');
  if(sf)d.append(el('div','pv-source',String(v[sf.key])));
  const ex=f.find(x=>x.type==='longtext'&&x!==p0&&v[x.key]);
  if(ex&&p0.type!=='longtext')d.append(el('div','pv-ex','« '+String(v[ex.key])+' »'));
  return d;
}

function seedFromNote(col,note){
  const v={};const f=col.fields;
  if(col.hint==='quote'){
    const q=parseQuote(note);
    if(q){v[f[0].key]=q.text;if(f[1])v[f[1].key]=q.author;if(f[2])v[f[2].key]=q.source;return v}
  }
  const kv=parseKv(note);
  if(kv.length){
    v[f[0].key]=kv[0].a;
    if(f[1])v[f[1].key]=kv[0].b;
  }else if(f[0].type==='longtext'){
    v[f[0].key]=(note.content||'').trim()||(note.items||[]).map(i=>i.text).join('\n')||note.title||'';
  }else{
    v[f[0].key]=(note.title||'').trim()||(note.content||'').split('\n')[0].trim();
  }
  const lt=f.find(x=>x.type==='longtext'&&x!==f[0]);
  if(lt&&v[lt.key]==null)
    v[lt.key]=(note.content||'').trim()||(note.items||[]).map(i=>i.text).join('\n')||'';
  const df=f.find(x=>x.type==='date');if(df&&!v[df.key])v[df.key]=todayISO();
  const tf=f.find(x=>x.type==='tags');
  if(tf&&!v[tf.key])v[tf.key]=note.labels.map(lid=>
    (state.labels.find(l=>l.id===lid)||{}).name).filter(Boolean).join(', ');
  return v;
}

function openEntryModal(opt){
  try{
    closeModal();closePopover();
    showModal();
    let col=opt.col||null, entry=opt.entry||null, note=opt.note||null;
    const editing=!!entry;
    const m={colId:col?col.id:null,multi:false,rows:[],v:{},arch:true};
    if(editing){m.colId=col.id;m.v=JSON.parse(JSON.stringify(entry.values))}
    const box=$('#modalBox');

    function draw(){
      box.innerHTML='';
      col=getCol(m.colId);
      const head=el('div','pub-head');
      head.append(icon(col?col.icon:'ios_share',true));
      head.append(el('div','pub-title',
        editing?'Modifier — '+col.name
        :note?'Envoyer « '+(note.title||'Note sans titre')+' »'
        :'Nouvelle entrée — '+(col?col.name:'')));
      const x=el('button','icon-btn');x.append(icon('close'));x.onclick=closeModal;
      head.append(x);box.append(head);

      if(note&&!editing){
        const sug=suggestCollection(note);
        const wrap=el('div','pub-segrow');const seg=el('div','seg');
        state.collections.forEach(c=>{
          const b=el('button',m.colId===c.id?'on':'');
          b.append(icon(c.icon),el('span','',c.name));
          if(sug===c.id&&m.colId!==c.id)b.append(el('span','seg-hint','détecté'));
          b.onclick=()=>{m.colId=c.id;initValues();draw()};
          seg.append(b);
        });
        wrap.append(seg);box.append(wrap);
        if(!m.colId){m.colId=sug||state.collections[0].id;col=getCol(m.colId)}
      }
      if(!col)return;
      initValues();

      const body=el('div','pub-body');
      const form=el('div','pub-form');
      form.append(el('div','pub-cap','Fiche — '+col.name));
      const frm=el('div','frm');form.append(frm);
      const prevWrap=el('div','pub-preview');
      prevWrap.append(el('div','pub-cap','Aperçu — tel que publié'));
      const prev=el('div','pv-stack');prevWrap.append(prev);
      body.append(form,prevWrap);box.append(body);

      const updPrev=()=>{
        prev.innerHTML='';
        if(m.multi){
          m.rows.slice(0,3).forEach(r=>{
            const vv={};col.fields.forEach(f=>vv[f.key]='');
            vv[col.fields[0].key]=r.a;
            if(col.fields[1])vv[col.fields[1].key]=r.b;
            prev.append(pvEntry(col,vv));
          });
          if(m.rows.length>3)prev.append(el('div','pv-more','+ '+(m.rows.length-3)+' autre(s)…'));
          if(!m.rows.length)prev.append(el('div','pv-more','Aucune entrée à prévisualiser.'));
        }else prev.append(pvEntry(col,m.v));
      };

      if(m.multi){
        const rowsWrap=el('div','frm');
        m.rows.forEach((r,i)=>{
          const row=el('div','mrow');
          const a=mkInput(col.fields[0].label,r.a,v=>{r.a=v;updPrev()});
          const b=mkInput(col.fields[1].label,r.b,v=>{r.b=v;updPrev()});
          const xx=el('button','mini-btn mx');xx.title='Retirer';xx.append(icon('close'));
          xx.onclick=()=>{m.rows.splice(i,1);draw()};
          row.append(a,b,xx);rowsWrap.append(row);
        });
        frm.append(rowsWrap);
        const add=el('button','ed-add-item');add.append(icon('add'),el('span','','Ajouter une ligne'));
        add.onclick=()=>{m.rows.push({a:'',b:''});draw()};
        frm.append(add);
      }else{
        col.fields.forEach(f=>{
          const val=m.v[f.key];
          if(f.type==='longtext'){
            const ta=document.createElement('textarea');ta.className='f-in';
            ta.placeholder='…';ta.value=val||'';
            ta.oninput=()=>{m.v[f.key]=ta.value;updPrev()};
            frm.append(mkField(f.label,ta));
          }else if(f.type==='date'){
            const i=el('input','f-in');i.type='date';i.value=val||'';
            i.oninput=()=>{m.v[f.key]=i.value;updPrev()};
            frm.append(mkField(f.label,i));
          }else if(f.type==='check'){
            const lab=el('label','opt-row');
            const cb=el('input');cb.type='checkbox';cb.checked=!!val;
            cb.onchange=()=>{m.v[f.key]=cb.checked;updPrev()};
            lab.append(cb,el('span','',f.label));
            frm.append(lab);
          }else if(f.type==='rating'){
            const w=el('div');w.style.cssText='display:flex;gap:2px';
            let cur=parseFloat(val)||0;
            const paint=()=>{[...w.children].forEach((s,i)=>{
              s.innerHTML='';s.append(icon('star',i<cur))})};
            for(let i=0;i<5;i++){
              const s=el('button','tool-btn');s.title=(i+1)+'/5';
              s.onclick=()=>{cur=cur===i+1?i:i+1;m.v[f.key]=cur;paint();updPrev()};
              w.append(s);
            }
            paint();
            frm.append(mkField(f.label+' (cliquez pour noter)',w));
          }else{
            frm.append(mkField(f.label,mkInput('…',val,v=>{m.v[f.key]=v;updPrev()})));
          }
        });
      }
      updPrev();

      const foot=el('div','pub-foot');
      if(note&&!editing){
        const lab=el('label','chk');
        const cb=el('input');cb.type='checkbox';cb.checked=true;
        cb.onchange=()=>m.arch=cb.checked;
        lab.append(cb,el('span','','Archiver la note après l\u2019envoi'));
        foot.append(lab);
      }
      foot.append(el('div','spacer'));
      const cancel=el('button','text-btn','Annuler');cancel.onclick=closeModal;
      const ok=el('button','pub-ok text-btn',editing?'Enregistrer':(note?'Envoyer':'Ajouter'));
      ok.onclick=()=>editing?saveEdit():send();
      foot.append(cancel,ok);box.append(foot);
    }

    function initValues(){
      if(editing)return;
      if(note){
        const kv=parseKv(note);
        m.multi=kv.length>=2&&col.dict&&col.fields[0].type==='text'
          &&col.fields[1]&&col.fields[1].type==='text';
        if(m.multi){m.rows=kv.map(l=>({a:l.a,b:l.b}));return}
      }
      if(!m._seededFor||m._seededFor!==m.colId){
        m.v=note?seedFromNote(col,note):sampleValues(col);
        m._seededFor=m.colId;
      }
    }
    function send(){
      const created=[];
      const now=Date.now();
      if(m.multi){
        m.rows.forEach(r=>{
          if(!r.a.trim()&&!r.b.trim())return;
          const v={};col.fields.forEach(f=>v[f.key]='');
          v[col.fields[0].key]=r.a.trim()||r.b.trim();
          if(col.fields[1])v[col.fields[1].key]=r.b.trim();
          created.push({id:uid(),values:v,src:note?note.id:null,created:now,edited:now});
        });
        if(!created.length){toast('Rien à envoyer : remplissez au moins une ligne.');return}
      }else{
        if(!String(m.v[col.fields[0].key]||'').trim()){
          toast('Rien à envoyer : le champ « '+col.fields[0].label+' » est vide.');return}
        const v={};col.fields.forEach(f=>{
          let val=m.v[f.key];
          v[f.key]=(typeof val==='string')?val.trim():(val==null?'':val)});
        created.push({id:uid(),values:v,src:note?note.id:null,created:now,edited:now});
      }
      col.items.push(...created);
      if(note&&m.arch){
        note.archived=true;
        if(editorNote===note)finishEditor();
      }
      save();closeModal();
      if(isColView()&&state.view==='col:'+col.id)renderCollection(col);else render(false);
      toast(created.length+' entrée'+(created.length>1?'s':'')+' envoyée'+(created.length>1?'s':'')
        +' — '+col.name,'Voir',()=>setView('col:'+col.id));
    }
    function saveEdit(){
      if(!String(m.v[col.fields[0].key]||'').trim()){
        toast('Le champ « '+col.fields[0].label+' » ne peut pas être vide.');return}
      col.fields.forEach(f=>{
        let val=m.v[f.key];
        entry.values[f.key]=(typeof val==='string')?val.trim():(val==null?'':val)});
      entry.edited=Date.now();save();closeModal();
      if(isColView()&&state.view==='col:'+col.id)renderCollection(col);else render(false);
      toast('Entrée mise à jour');
    }
    draw();
  }catch(err){
    console.error(err);
    toast('Erreur : '+err.message);
  }
}

/* ================= Modal — Atelier / constructeur ================= */
function openBuilder(existing){
  try{
    closeModal();closePopover();
    showModal();
    const creating=!existing;
    const b=existing?JSON.parse(JSON.stringify(
      {name:existing.name,icon:existing.icon,accent:existing.accent,paper:existing.paper,
       dict:existing.dict,feat:existing.feat,groupBy:existing.groupBy||'',fields:existing.fields}))
      :presetCopy(PRESETS[0]);
    b.srcExisting=existing||null;
    const box=$('#modalBox');

    function drawB(){
      box.innerHTML='';
      const head=el('div','pub-head');
      head.append(icon('dashboard_customize',true));
      head.append(el('div','pub-title',creating?'Atelier — Nouvelle collection':'Atelier — Modifier « '+b.name+' »'));
      const x=el('button','icon-btn');x.append(icon('close'));x.onclick=closeModal;
      head.append(x);box.append(head);

      if(creating){
        const wrap=el('div','pub-segrow');const seg=el('div','seg');
        PRESETS.forEach(p=>{
          const bt=el('button',p===PRESETS[0]&&creating&&!b._touched?'on':'');
          bt.append(icon(p.icon),el('span','',p.name));
          bt.onclick=()=>{b._touched=true;Object.assign(b,presetCopy(p));drawB()};
          seg.append(bt);
        });
        const hint=el('div','opt-sub');hint.style.cssText='padding:8px 4px 0';
        hint.textContent='La Super-collection contient tous les types de champs : créez-la puis retirez ce qui ne sert pas. Ou partez d\u2019un archétype plus ciblé.';
        wrap.append(seg,hint);box.append(wrap);
      }

      const body=el('div','pub-body');
      const form=el('div','pub-form');
      const frm=el('div','frm');form.append(frm);
      const prevWrap=el('div','pub-preview');
      prevWrap.append(el('div','pub-cap','Aperçu de la fiche type'));
      const prev=el('div','pv-stack');prevWrap.append(prev);
      body.append(form,prevWrap);box.append(body);

      frm.append(el('div','pub-cap','Identité'));
      frm.append(mkField('Nom de la collection',mkInput('Mes recettes, Films à voir…',b.name,v=>{b.name=v;updPrev()})));
      frm.append(mkField('Icône',(()=>{
        const g=el('div','icon-grid');
        ICONS.forEach(ic=>{const bt=el('button',b.icon===ic?'sel':'');
          bt.style.setProperty('--accent',b.accent);
          bt.append(icon(ic));bt.title=ic;
          bt.onclick=()=>{b.icon=ic;drawB()};
          g.append(bt)});
        return g})()));
      frm.append(mkField('Couleur d\u2019accent',(()=>{
        const g=el('div','acc-grid');
        ACCENTS.forEach(a=>{const bt=el('button',b.accent===a?'sel':'');
          bt.style.background=a;bt.title=a;
          if(b.accent===a)bt.append(icon('check'));
          bt.onclick=()=>{b.accent=a;drawB()};
          g.append(bt)});
        return g})()));

      frm.append(el('div','pub-cap','Champs — retirez ceux qui ne servent pas'));
      const rowsWrap=el('div','frm');frm.append(rowsWrap);
      b.fields.forEach((f,i)=>{
        const row=el('div','b-frow');
        const up=el('button','b-arrow');up.title='Monter';up.append(icon('keyboard_arrow_up'));
        up.disabled=i===0;up.style.opacity=i===0?.25:1;
        up.onclick=()=>{[b.fields[i-1],b.fields[i]]=[b.fields[i],b.fields[i-1]];drawB()};
        const dn=el('button','b-arrow');dn.title='Descendre';dn.append(icon('keyboard_arrow_down'));
        dn.disabled=i===b.fields.length-1;dn.style.opacity=i===b.fields.length-1?.25:1;
        dn.onclick=()=>{[b.fields[i+1],b.fields[i]]=[b.fields[i],b.fields[i+1]];drawB()};
        const lab=mkInput('Libellé du champ',f.label,v=>{f.label=v;updPrev()});
        const sel=el('select','f-in');
        FIELD_TYPES.forEach(([t,name])=>{
          const o=el('option',null,name);o.value=t;if(f.type===t)o.selected=true;sel.append(o)});
        sel.onchange=()=>{f.type=sel.value;updPrev()};
        row.append(up,dn,lab,sel);
        if(i===0){
          const lock=el('span','b-prim','primaire');lock.title='Le premier champ est le champ principal';
          row.append(lock);
        }else{
          const xx=el('button','b-arrow');xx.title='Retirer ce champ';xx.append(icon('close'));
          xx.onclick=()=>{b.fields.splice(i,1);drawB()};
          row.append(xx);
        }
        rowsWrap.append(row);
      });
      const addB=el('button','ed-add-item');addB.append(icon('add'),el('span','','Ajouter un champ'));
      addB.onclick=()=>{b.fields.push({key:'k'+uid(),label:'',type:'text'});drawB();
        const inps=rowsWrap.querySelectorAll('input');
        inps[inps.length-1]&&inps[inps.length-1].focus()};
      frm.append(addB);

      frm.append(el('div','pub-cap','Affichage'));
      const opt1=el('label','opt-row');
      const cbD=el('input');cbD.type='checkbox';cbD.checked=b.dict;
      cbD.onchange=()=>{b.dict=cbD.checked;if(b.dict)b.groupBy='';drawB()};
      opt1.append(cbD,el('span','','Index A-Z (mode dictionnaire)'));
      frm.append(opt1);
      const opt2=el('label','opt-row');
      const cbP=el('input');cbP.type='checkbox';cbP.checked=b.paper;
      cbP.onchange=()=>{b.paper=cbP.checked;drawB()};
      opt2.append(cbP,el('span','','Style « papier » — typographie serif, esprit dictionnaire ancien'));
      frm.append(opt2);
      const opt3=el('label','opt-row');
      const cbF=el('input');cbF.type='checkbox';cbF.checked=b.feat;
      cbF.onchange=()=>{b.feat=cbF.checked};
      opt3.append(cbF,el('span','','Mettre une entrée en vedette chaque jour'));
      frm.append(opt3);
      const grpWrap=el('div','f-field');grpWrap.style.marginTop='4px';
      grpWrap.append(el('div','f-lab','Regrouper les entrées par'));
      const selG=el('select','f-in');
      const oN=el('option',null,'— Aucun groupement —');oN.value='';selG.append(oN);
      b.fields.forEach(f=>{const o=el('option',null,f.label||'Champ');o.value=f.key;
        if(b.groupBy===f.key)o.selected=true;selG.append(o)});
      selG.disabled=b.dict;
      selG.onchange=()=>{b.groupBy=selG.value};
      grpWrap.append(selG);
      if(b.dict){const h=el('div','opt-sub','Inactif en mode dictionnaire (regroupement par lettre).');grpWrap.append(h)}
      frm.append(grpWrap);

      const updPrev=()=>{
        prev.innerHTML='';
        const probe={fields:b.fields.map((f,i)=>({key:'pk'+i,label:f.label||('Champ '+(i+1)),type:f.type})),
          paper:b.paper,accent:b.accent,dict:b.dict,name:b.name};
        const v={};
        probe.fields.forEach((f,i)=>{
          const src=b.fields[i];
          switch(src.type){
            case 'longtext':v[f.key]=i===0?'Un texte d\u2019exemple, élégant et prêt à être publié.':'Détails d\u2019exemple…';break;
            case 'date':v[f.key]=todayISO();break;
            case 'number':v[f.key]=42;break;
            case 'rating':v[f.key]=4;break;
            case 'tags':v[f.key]=b.name?'exemple':'exemple, essai';break;
            case 'url':v[f.key]='https://exemple.fr';break;
            case 'check':v[f.key]=true;break;
            default:v[f.key]=i===0?(b.name||'Exemple'):'Valeur';
          }
        });
        prev.append(pvEntry(probe,v));
        prev.append(el('div','pv-more',b.dict?'Vue : index A-Z sur « '+(probe.fields[0].label)+' »'
          :b.groupBy?'Vue : regroupée par « '+((b.fields.find(f=>f.key===b.groupBy)||{}).label||'?')+' »'
          :'Vue : liste simple'));
      };
      updPrev();

      const foot=el('div','pub-foot');
      foot.append(el('div','spacer'));
      const cancel=el('button','text-btn','Annuler');cancel.onclick=closeModal;
      const ok=el('button','pub-ok text-btn',creating?'Créer la collection':'Enregistrer');
      ok.onclick=()=>{
        if(!b.name.trim()){toast('Donnez un nom à votre collection.');return}
        if(!b.fields[0].label.trim())b.fields[0].label='Titre';
        b.fields.forEach((f,i)=>{if(!f.label.trim())f.label='Champ '+(i+1)});
        if(b.srcExisting){
          const c=b.srcExisting;
          Object.assign(c,{name:b.name.trim(),icon:b.icon,accent:b.accent,paper:b.paper,
            dict:b.dict,feat:b.feat,groupBy:b.dict?'':b.groupBy,fields:b.fields});
          c.items.forEach(e=>{c.fields.forEach(f=>{
            if(e.values[f.key]==null)e.values[f.key]=''})});
          save();closeModal();render(false);toast('Collection mise à jour');
        }else{
          const c={id:uid(),name:b.name.trim(),icon:b.icon,accent:b.accent,paper:b.paper,
            dict:b.dict,feat:b.feat,groupBy:b.dict?'':b.groupBy,hint:null,
            fields:b.fields.map(f=>({key:f.key,label:f.label,type:f.type})),items:[]};
          state.collections.push(c);
          save();closeModal();render(false);
          toast('Collection « '+c.name+' » créée','Ouvrir',()=>setView('col:'+c.id));
        }
      };
      foot.append(cancel,ok);box.append(foot);
    }
    drawB();
  }catch(err){
    console.error(err);
    toast('Erreur : '+err.message);
  }
}

/* ================= Génération de sites statiques ================= */
function downloadSite(name,html){
  const blob=new Blob([html],{type:"text/html;charset=utf-8"});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  toast('Site généré : '+name+' — hébergeable tel quel (GitHub Pages, Netlify…)');
}

function buildCollectionSite(col){
  const paper=!!col.paper, accent=paper?'#8a3324':(col.accent||'#3e6b4f');
  const F=col.fields.map(f=>({k:f.key,l:f.label,t:f.type}));
  const I=col.items.map(e=>{
    const o={};
    col.fields.forEach(f=>{
      let v=e.values[f.key];
      if(f.type==='date'&&v)v=fmtISO(v);
      if(f.type==='check')v=v?'✓':'';
      o[f.key]=v==null?'':String(v);
    });
    return o;
  });
  const cfg=JSON.stringify({F,I,dict:!!col.dict,
    gi:col.groupBy?F.findIndex(f=>f.k===col.groupBy):-1}).replace(/</g,'\\u003c');
  const fonts=paper
    ?'<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">'
    :'<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">';
  return [
"<!DOCTYPE html>",
'<html lang="fr"><head><meta charset="UTF-8">',
'<meta name="viewport" content="width=device-width,initial-scale=1">',
"<title>"+col.name.replace(/</g,'&lt;')+"</title>",
fonts,"<style>",siteCss(paper,accent),
"</style></head><body><div class=\"wrap\">",
"<header><h1>"+col.name.replace(/</g,'&lt;')+"</h1>",
'<div class="sub">Recueil personnel</div>',
'<input id="q" placeholder="Rechercher…" autocomplete="off"></header>',
"<div id=\"idx\"></div><div id=\"meta\"></div>",
"<main id=\"out\"></main>",
"<footer>Recueil généré localement le "+new Date().toLocaleDateString("fr-FR")+"</footer>",
"</div><script>",
"var D="+cfg+";",
"var F=D.F,I=D.I,dict=D.dict,gi=D.gi,PK=F[0].k;",
'var q=document.getElementById("q"),out=document.getElementById("out"),idx=document.getElementById("idx"),meta=document.getElementById("meta");',
"var letter=null;",
'function esc(s){return String(s).replace(/[&<>"]/g,function(c){return c=="&"?"&amp;":c=="<"?"&lt;":c==">"?"&gt;":"&quot;"})}',
"function fieldHtml(f,e){",
"  var v=e[f.k];if(!v)return'';",
'  if(f.t=="tags"){var h="",parts=v.split(",");for(var i=0;i<parts.length;i++){var t=parts[i].replace(/^\\s+|\\s+$/g,"");if(t)h+=\'<span class="tag">\'+esc(t)+"</span> "}return h}',
'  if(f.t=="rating"){var r=parseInt(v)||0;var s="";for(var i=0;i<5;i++)s+=i<r?"★":"☆";return \'<span class="stars">\'+s+"</span>"}',
'  if(f.t=="check")return v?\'<span class="flag">✓ \'+esc(f.l)+"</span>": "";',
'  if(f.t=="number")return \'<span class="num">\'+esc(v)+"</span>";',
'  if(f.t=="url"){var h=v;var m=v.match(/^https?:\\/\\/([^\\/?#]+)/);if(m)h=m[1];return \'<a href="\'+esc(v)+\'" target="_blank" rel="noopener">\'+esc(h)+"</a>"}',
'  return \'<span>\'+esc(v)+"</span> ";',
"}",
"function itemHtml(e){",
'  var lt=F[0].t=="longtext";',
'  var h="<div class=\'item\'><span class=\'p"+(lt?" lt":"")+"\'>"+esc(e[PK])+"</span>";',
"  var m='';",
"  for(var i=1;i<F.length;i++){if(F[i].t=='longtext')continue;m+=fieldHtml(F[i],e)}",
'  if(m)h+="</span><div class=\'meta\'>"+m+"</div>";else h+="</span>";',
"  for(var i=1;i<F.length;i++){if(F[i].t=='longtext'&&e[F[i].k])h+=\"<div class='body'>\"+esc(e[F[i].k])+\"</div>\"}",
"  return h+'</div>';",
"}",
"function render(){",
"  var t=q.value.toLowerCase(),list=[],i;",
"  for(i=0;i<I.length;i++){var e=I[i];",
"    if(dict&&letter&&e[PK].charAt(0).toUpperCase()!=letter)continue;",
"    if(t){var hay='';for(var j=0;j<F.length;j++)hay+=e[F[j].k]+' ';",
"    if(hay.toLowerCase().indexOf(t)<0)continue;}",
"    list.push(e);}",
'  list.sort(function(a,b){return a[PK].localeCompare(b[PK],"fr")});',
"  var html='',count=list.length;",
"  if(dict){",
"    var last=null;",
"    list.forEach(function(e){",
"      var L=e[PK].charAt(0).toUpperCase();",
"      if(L!=last){if(last)html+=\"</div></div>\";html+=\"<div class='grp'><div class='ltr'>\"+L+\"</div><div>\";last=L}",
"      html+=itemHtml(e);});",
"    if(last)html+='</div></div>';",
"  }else if(gi>=0){",
"    var gk=F[gi].k,groups={},order=[];",
"    list.forEach(function(e){var k=e[gk]||'—';if(!groups[k]){groups[k]=[];order.push(k)}groups[k].push(e)});",
'    order.sort(function(a,b){return a.localeCompare(b,"fr")});',
"    order.forEach(function(k){",
"      html+=\"<div class='gh'>\"+esc(k)+\"</div>\";",
"      groups[k].forEach(function(e){html+=itemHtml(e)});});",
"  }else{",
"    list.forEach(function(e){html+=itemHtml(e)});",
"  }",
'  out.innerHTML=html||"<div class=\'empty\'>Aucune entrée.</div>";',
'  meta.textContent=count+(count>1?" entrées":" entrée");',
"}",
"function buildIdx(){",
"  if(!dict){idx.style.display='none';return}",
"  var present={},i;for(i=0;i<I.length;i++)present[I[i][PK].charAt(0).toUpperCase()]=1;",
'  var h="",AZ="ABCDEFGHIJKLMNOPQRSTUVWXYZ";',
'  for(i=0;i<AZ.length;i++){var L=AZ.charAt(i);h+=\'<button data-l="\'+L+\'"\'+(present[L]?"":" disabled")+">"+L+"</button>";}',
"  idx.innerHTML=h;",
'  var bs=idx.querySelectorAll("button");',
"  bs.forEach(function(b){b.onclick=function(){",
'    var L=b.getAttribute("data-l");',
"    letter=(letter==L)?null:L;",
'    bs.forEach(function(x){x.className=(x==b&&letter)?"on":""});',
"    render();}});",
"}",
'q.addEventListener("input",render);',
"buildIdx();render();",
"</scr"+"ipt></body></html>"
  ].join("\n");
}

/* ================= Drag & drop — souris ================= */
const gridArea=$('#gridArea');
function reorderNotes(dragId,targetId,before){
  const from=state.notes.findIndex(n=>n.id===dragId);
  if(from<0)return;
  const [m]=state.notes.splice(from,1);
  let to=state.notes.findIndex(n=>n.id===targetId);
  if(to<0){state.notes.splice(Math.min(from,state.notes.length),0,m);return}
  if(!before)to++;
  state.notes.splice(to,0,m);
  save();render(false);
}
gridArea.addEventListener('dragstart',e=>{
  const card=e.target.closest('.note-card');if(!card)return;
  dragId=card.dataset.id;card.classList.add('dragging');
  e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragId);
});
gridArea.addEventListener('dragover',e=>{
  if(!dragId)return;
  gridArea.querySelectorAll('.drop-before,.drop-after')
    .forEach(x=>x.classList.remove('drop-before','drop-after'));
  const card=e.target.closest('.note-card');
  if(!card||card.dataset.id===dragId)return;
  e.preventDefault();e.dataTransfer.dropEffect='move';
  const r=card.getBoundingClientRect();
  card.classList.add(e.clientY<r.top+r.height/2?'drop-before':'drop-after');
});
gridArea.addEventListener('drop',e=>{
  if(!dragId)return;
  const card=e.target.closest('.note-card');
  if(card&&card.dataset.id!==dragId){
    e.preventDefault();
    reorderNotes(dragId,card.dataset.id,card.classList.contains('drop-before'));
  }
  clearDrag();
});
gridArea.addEventListener('dragend',clearDrag);
function clearDrag(){dragId=null;
  gridArea.querySelectorAll('.dragging,.drop-before,.drop-after')
    .forEach(x=>x.classList.remove('dragging','drop-before','drop-after'))}

/* ================= Drag & drop — tactile (appui long) ================= */
let tDrag=null;
const canTouchDrag=()=>!['workshop','trash'].includes(state.view)&&!isColView();
gridArea.addEventListener('touchstart',e=>{
  if(!canTouchDrag()||e.touches.length!==1)return;
  const card=e.target.closest('.note-card');
  if(!card||!card.dataset.id)return;
  if(e.target.closest('a,button,input,textarea,.row-acts'))return;
  const t=e.touches[0];
  tDrag={card,id:card.dataset.id,startX:t.clientX,startY:t.clientY,started:false,
    target:null,before:false,offX:null,ghost:null,
    timer:setTimeout(()=>{
      if(!tDrag)return;
      tDrag.started=true;
      if(navigator.vibrate){try{navigator.vibrate(25)}catch(_){}}
      startTouchDrag();
    },350)};
},{passive:true});
function startTouchDrag(){
  const td=tDrag,r=td.card.getBoundingClientRect();
  td.ghost=td.card.cloneNode(true);
  td.ghost.style.cssText='position:fixed;left:'+r.left+'px;top:'+r.top+'px;width:'+r.width+
    'px;margin:0;z-index:400;pointer-events:none;opacity:.95;box-shadow:var(--sh2);transform:rotate(1.5deg)';
  document.body.appendChild(td.ghost);
  td.card.classList.add('dragging');
  document.body.classList.add('tdrag');
}
gridArea.addEventListener('touchmove',e=>{
  const td=tDrag;if(!td)return;
  const t=e.touches[0];
  if(!td.started){
    if(Math.hypot(t.clientX-td.startX,t.clientY-td.startY)>12){clearTimeout(td.timer);tDrag=null}
    return;
  }
  e.preventDefault();
  if(td.offX==null){
    const r=td.card.getBoundingClientRect();
    td.offX=td.startX-r.left;td.offY=td.startY-r.top;
  }
  td.ghost.style.left=(t.clientX-td.offX)+'px';
  td.ghost.style.top=(t.clientY-td.offY)+'px';
  td.ghost.style.visibility='hidden';
  const under=document.elementFromPoint(t.clientX,t.clientY);
  td.ghost.style.visibility='';
  const tcard=under&&under.closest?under.closest('.note-card'):null;
  gridArea.querySelectorAll('.drop-before,.drop-after')
    .forEach(x=>x.classList.remove('drop-before','drop-after'));
  td.target=null;
  if(tcard&&tcard.dataset.id&&tcard.dataset.id!==td.id){
    const r=tcard.getBoundingClientRect();
    td.before=t.clientY<r.top+r.height/2;
    tcard.classList.add(td.before?'drop-before':'drop-after');
    td.target=tcard;
  }
},{passive:false});
function endTouchDrag(e,perform){
  const td=tDrag;if(!td)return;
  clearTimeout(td.timer);
  if(td.started){
    if(perform&&e&&e.cancelable)e.preventDefault();
    if(perform&&td.target)reorderNotes(td.id,td.target.dataset.id,!!td.before);
    if(td.ghost)td.ghost.remove();
    td.card.classList.remove('dragging');
    document.body.classList.remove('tdrag');
    gridArea.querySelectorAll('.drop-before,.drop-after')
      .forEach(x=>x.classList.remove('dragging','drop-before','drop-after'));
  }
  tDrag=null;
}
gridArea.addEventListener('touchend',e=>endTouchDrag(e,true),{passive:false});
gridArea.addEventListener('touchcancel',()=>endTouchDrag(null,false),{passive:true});
gridArea.addEventListener('contextmenu',e=>{
  if(tDrag&&tDrag.started)e.preventDefault();
});

/* ================= Délégation des clics ================= */
 $('#main').addEventListener('click',e=>{
  const q=e.target.closest('[data-quick]');
  if(q){quick(q.dataset.quick);return}
  const b=e.target.closest('[data-act]');
  if(b){const card=b.closest('.note-card');
    if(card)handleAct(b.dataset.act,card.dataset.id,b);return}
  const card=e.target.closest('.note-card');
  if(card){
    if(state.view==='trash')toast('Restaurez la note pour la modifier.');
    else openEditor(card.dataset.id);
  }
});

/* ================= Rappels ================= */
function checkReminders(){
  const now=Date.now();let changed=false;
  state.notes.forEach(n=>{
    if(n.reminder&&n.reminder<=now&&!n.reminderFired&&!n.trashed){
      n.reminderFired=true;changed=true;
      toast('Rappel — '+(n.title||'Note sans titre'),'Ouvrir',()=>{
        if(n.trashed)return;state.view='notes';openEditor(n.id)});
    }
  });
  if(changed)save();
}

/* ================= Header & global ================= */
 $('#menuBtn').onclick=()=>{
  if(matchMedia('(max-width:768px)').matches)document.body.classList.toggle('sb-open');
  else document.body.classList.toggle('sb-collapsed');
};
 $('#scrimSide').onclick=()=>document.body.classList.remove('sb-open');
 $('#searchInput').addEventListener('input',e=>{
  state.search=e.target.value.trim();
  $('#searchClear').classList.toggle('hidden',!state.search);
  render(false);
});
 $('#searchClear').onclick=()=>{
  state.search='';$('#searchInput').value='';$('#searchClear').classList.add('hidden');
  render(false);$('#searchInput').focus();
};
 $('#viewToggle').onclick=()=>{state.listMode=!state.listMode;save();render(false)};
 $('#themeToggle').onclick=()=>{
  const html=document.documentElement;
  html.dataset.theme=html.dataset.theme==='dark'?'light':'dark';
  save();updateHeaderIcons();
};
 $('#profileBtn').onclick=e=>togglePop('profile',e.currentTarget,buildProfile);

 $('#editorScrim').addEventListener('click',e=>{if(e.target.id==='editorScrim')closeEditor()});
 $('#modalScrim').addEventListener('click',e=>{if(e.target.id==='modalScrim')closeModal()});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(!$('#modalScrim').classList.contains('hidden'))closeModal();
    else if(pop.dataset.anchor&&!pop.classList.contains('hidden'))closePopover();
    else if(!$('#editorScrim').classList.contains('hidden'))closeEditor();
    else document.body.classList.remove('sb-open');
  }
  if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){
    e.preventDefault();$('#searchInput').focus()}
});
window.addEventListener('resize',debounce(()=>render(false),150));

/* ================= Init ================= */
load();
render(true);
checkReminders();
setInterval(checkReminders,20000);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>render(false));
</script>
