<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keep</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%23fbbc04' d='M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7z'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
<style>
/* ============ Base & thème ============ */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  color-scheme:light;
  --bg:#fff; --card:#fff; --text:#202124; --text2:#5f6368; --line:#e0e0e0;
  --hover:rgba(60,64,67,.08); --search:#f1f3f4; --active:#feefc3; --scrim:rgba(32,33,36,.55);
  --sh1:0 1px 2px rgba(60,64,67,.3),0 1px 3px 1px rgba(60,64,67,.15);
  --sh2:0 1px 3px rgba(60,64,67,.3),0 4px 8px 3px rgba(60,64,67,.15);
  --pop-bg:#fff; --toast-bg:#323232; --toast-fg:#f1f1f1; --toast-act:#fdd663; --danger:#d93025;
}
[data-theme=dark]{
  color-scheme:dark;
  --bg:#202124; --card:#252525; --text:#e8eaed; --text2:#9aa0a6; --line:#3c4043;
  --hover:rgba(232,234,237,.08); --search:#303134; --active:#3c4043; --scrim:rgba(0,0,0,.7);
  --sh1:0 1px 2px rgba(0,0,0,.5); --sh2:0 1px 3px rgba(0,0,0,.5),0 4px 8px 3px rgba(0,0,0,.35);
  --pop-bg:#2f2f33; --toast-bg:#e3e2e6; --toast-fg:#313033; --toast-act:#8a6a00; --danger:#f28b82;
}
html,body{height:100%}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);font-size:14px;overflow-y:scroll}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}

.ms{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;
  letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;
  font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;user-select:none;font-size:20px}
.ms.fill{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}

.icon-btn{width:40px;height:40px;border-radius:50%;border:none;background:none;color:var(--text2);
  display:grid;place-items:center;flex:none;transition:background .15s}
.icon-btn:hover{background:var(--hover)}
.icon-btn.on{color:var(--text)}
.icon-btn.on .ms{color:var(--text)}
.mini-btn{width:28px;height:28px;border:none;background:none;border-radius:50%;color:var(--text2);display:grid;place-items:center}
.mini-btn:hover{background:var(--hover)}
.mini-btn .ms{font-size:18px}
.text-btn{border:none;background:none;font-size:14px;font-weight:500;color:var(--text);padding:8px 14px;border-radius:4px}
.text-btn:hover{background:var(--hover)}
.text-btn.danger{color:var(--danger)}

/* ============ Header ============ */
#topbar{position:fixed;top:0;left:0;right:0;height:64px;display:flex;align-items:center;gap:6px;
  padding:0 10px;background:var(--bg);z-index:60}
.tb-left{display:flex;align-items:center}
.brand{display:flex;align-items:center;gap:8px;padding:0 10px 0 4px;user-select:none}
.brand .ms{font-size:26px;color:#fbbc04}
.brand-name{font-size:22px;color:var(--text2);font-weight:400}
.tb-search{flex:1;max-width:720px;height:48px;background:var(--search);border-radius:8px;display:flex;
  align-items:center;gap:10px;padding:0 6px 0 16px;margin:0 16px;transition:box-shadow .2s,background .2s}
.tb-search:focus-within{box-shadow:var(--sh1);background:var(--card)}
.tb-search .ms{color:var(--text2);flex:none}
.tb-search input{flex:1;min-width:0;border:none;background:none;outline:none;font:inherit;font-size:16px;color:var(--text)}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:2px}
.avatar{width:36px;height:36px;border-radius:50%;border:none;background:#188038;color:#fff;
  font-weight:700;font-size:15px;display:grid;place-items:center;margin-left:6px}
.avatar:hover{filter:brightness(1.08)}

/* ============ Sidebar ============ */
#sidebar{position:fixed;top:64px;bottom:0;left:0;width:240px;padding:12px 0 24px;overflow-y:auto;
  overflow-x:hidden;background:var(--bg);transition:width .2s ease;z-index:80}
.nav-item{display:flex;align-items:center;gap:16px;height:40px;padding-left:22px;margin:0 10px 2px 0;
  border-radius:0 20px 20px 0;cursor:pointer;font-size:14px;font-weight:500;color:var(--text);
  user-select:none;white-space:nowrap}
.nav-item .ms{font-size:20px;flex:none;color:var(--text2)}
.nav-item:hover{background:var(--hover)}
.nav-item.active{background:var(--active)}
.nav-item.active .ms{color:var(--text);font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
.nav-label-text{overflow:hidden;text-overflow:ellipsis}
.nav-sep{height:1px;background:var(--line);margin:10px 16px}
.nav-section-title{padding:14px 24px 8px;font-size:11px;font-weight:700;letter-spacing:.9px;
  text-transform:uppercase;color:var(--text2)}
body.sb-collapsed #sidebar{width:74px}
body.sb-collapsed .nav-item{width:52px;margin:2px auto;padding:0;justify-content:center;border-radius:50%;height:48px}
body.sb-collapsed .nav-label-text,body.sb-collapsed .nav-section-title{display:none}
body.sb-collapsed .nav-sep{margin:10px 14px}
#scrimSide{display:none}

/* ============ Zone principale ============ */
#main{margin-left:240px;margin-top:64px;transition:margin .2s ease;min-height:calc(100vh - 64px)}
body.sb-collapsed #main{margin-left:74px}
.main-inner{max-width:1600px;margin:0 auto;padding:20px 26px 140px}
.view-title{font-size:24px;font-weight:500;text-align:center;margin:14px 0 6px}
.view-sub{font-size:13px;color:var(--text2);text-align:center;margin-bottom:10px}
.trash-empty{display:block;margin:4px auto 0;color:var(--danger)}
.sec-title{font-size:14px;font-weight:500;color:var(--text2);text-align:center;margin:20px 0 16px}

/* ============ Composer ============ */
#composer{max-width:600px;margin:0 auto 28px;background:var(--card);border-radius:8px;box-shadow:var(--sh1);
  display:flex;align-items:center;padding:4px 6px 4px 16px;transition:box-shadow .15s}
#composer:hover{box-shadow:var(--sh2)}
.composer-main{flex:1;height:44px;display:flex;align-items:center;color:var(--text2);font-size:15px;cursor:text}
.composer-icons{display:flex;gap:2px}
.tool-btn{width:34px;height:34px;border-radius:50%;border:none;background:none;color:var(--text2);
  display:grid;place-items:center;transition:background .15s}
.tool-btn:hover{background:var(--hover)}
.tool-btn .ms{font-size:19px}

/* ============ Notes (cartes) ============ */
.masonry{display:flex;gap:16px;align-items:flex-start}
.mcol{flex:1;min-width:0;display:flex;flex-direction:column;gap:16px}
.masonry.list .mcol{max-width:620px;margin:0 auto}
.note-card{position:relative;background:var(--nc,var(--card));color:var(--nt);border-radius:8px;
  padding:16px;box-shadow:var(--sh1);cursor:pointer;transition:box-shadow .15s ease}
[data-theme=dark] .note-card{border:1px solid rgba(255,255,255,.06)}
.note-card:hover{box-shadow:var(--sh2)}
.note-card.anim{animation:cardIn .28s ease both}
@keyframes cardIn{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1}}
.note-card.dragging{opacity:.4}
.note-card{--nt:#202124;--nt2:#5f6368;--chipb:rgba(0,0,0,.22)}
[data-theme=dark] .note-card{--nt:#e8eaed;--nt2:#bdc1c6;--chipb:rgba(255,255,255,.26)}
.note-card.drop-before::before,.note-card.drop-after::after{content:'';position:absolute;left:0;right:0;
  height:3px;border-radius:3px;background:#f9ab00;z-index:5}
.note-card.drop-before::before{top:-10px}
.note-card.drop-after::after{bottom:-10px}

.nc-default{--nc:#fff}.nc-red{--nc:#f28b82}.nc-orange{--nc:#fbbc04}.nc-yellow{--nc:#fff475}
.nc-green{--nc:#ccff90}.nc-teal{--nc:#a7ffeb}.nc-blue{--nc:#cbf0f8}.nc-cerulean{--nc:#aecbfa}
.nc-purple{--nc:#d7aefb}.nc-pink{--nc:#fdcfe8}.nc-brown{--nc:#e6c9a8}.nc-gray{--nc:#e8eaed}
[data-theme=dark] .nc-default{--nc:#252525}[data-theme=dark] .nc-red{--nc:#5c2b29}
[data-theme=dark] .nc-orange{--nc:#5e3a12}[data-theme=dark] .nc-yellow{--nc:#574a19}
[data-theme=dark] .nc-green{--nc:#3d4b22}[data-theme=dark] .nc-teal{--nc:#1f4a44}
[data-theme=dark] .nc-blue{--nc:#234a56}[data-theme=dark] .nc-cerulean{--nc:#2b4559}
[data-theme=dark] .nc-purple{--nc:#453260}[data-theme=dark] .nc-pink{--nc:#4e3042}
[data-theme=dark] .nc-brown{--nc:#54432e}[data-theme=dark] .nc-gray{--nc:#3c4043}

.nc-reminder{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:500;
  background:rgba(32,33,36,.07);border-radius:6px;padding:5px 6px 5px 10px;margin-bottom:12px;width:fit-content}
[data-theme=dark] .nc-reminder{background:rgba(255,255,255,.09)}
.nc-reminder .ms{font-size:16px}
.chip-x{border:none;background:none;color:inherit;width:22px;height:22px;border-radius:50%;
  display:grid;place-items:center;opacity:.7}
.chip-x:hover{opacity:1;background:rgba(0,0,0,.1)}
.chip-x .ms{font-size:15px}
.nc-pin{position:absolute;top:6px;right:6px;width:36px;height:36px;border:none;background:none;
  color:var(--nt);border-radius:50%;display:grid;place-items:center;opacity:0;transition:transform .25s cubic-bezier(.34,1.56,.64,1),opacity .15s}
.note-card:hover .nc-pin{opacity:1}
.nc-pin.pinned{opacity:1;transform:rotate(45deg)}
.nc-pin:hover{background:var(--hover)}
.nc-image{margin:-16px -16px 12px;border-radius:8px 8px 0 0;overflow:hidden}
.nc-image img{width:100%;display:block;aspect-ratio:var(--ar,4/3);object-fit:cover}
.nc-title{font-size:16px;font-weight:500;line-height:1.4;margin-bottom:6px;padding-right:26px;word-break:break-word}
.nc-body{font-size:13.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.nc-list{display:flex;flex-direction:column;gap:7px}
.nc-li{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.45;word-break:break-word}
.nc-li.done span{text-decoration:line-through;color:var(--nt2)}
.nc-check{border:none;background:none;color:var(--nt);padding:0;width:20px;height:20px;flex:none;display:grid;place-items:center;border-radius:50%}
.nc-check:hover{background:var(--hover)}
.nc-check .ms{font-size:18px}
.nc-hidden-count{font-size:12px;color:var(--nt2);margin-top:4px}
.nc-labels{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip-label{font-size:11.5px;font-weight:500;border:1px solid var(--chipb);border-radius:4px;padding:2px 8px;opacity:.85}
.nc-tools{display:flex;gap:2px;margin:8px -6px -6px 0;opacity:0;transition:opacity .15s}
.note-card:hover .nc-tools{opacity:1}
.nc-tools .tool-btn{color:var(--nt2)}
.nc-trash-actions{display:flex;gap:6px;margin:10px -10px -6px 0}
.nc-trash-actions .text-btn{font-size:13px;padding:7px 10px}
@media (hover:none){.nc-pin,.nc-tools{opacity:1}}

/* ============ État vide ============ */
.empty{display:flex;flex-direction:column;align-items:center;gap:14px;padding:100px 20px;color:var(--text2)}
.empty .ms{font-size:104px;opacity:.4}
.empty p{font-size:15px}

/* ============ Éditeur ============ */
#editorScrim{position:fixed;inset:0;background:var(--scrim);z-index:100;display:flex;
  align-items:flex-start;justify-content:center;padding:52px 16px 40px;overflow-y:auto}
#editor{background:var(--nc,var(--card));color:var(--nt);width:100%;max-width:600px;border-radius:8px;
  box-shadow:var(--sh2);animation:edIn .18s ease}
@keyframes edIn{from{opacity:0;transform:scale(.96) translateY(-10px)}to{opacity:1}}
.ed-img{position:relative;border-radius:8px 8px 0 0;overflow:hidden}
.ed-img img{width:100%;display:block;object-fit:cover}
.ed-img-x{position:absolute;top:8px;right:8px;width:32px;height:32px;border:none;border-radius:50%;
  background:rgba(32,33,36,.55);color:#fff;display:grid;place-items:center;opacity:0;transition:opacity .15s}
.ed-img:hover .ed-img-x{opacity:1}
.ed-top{display:flex;justify-content:flex-end;gap:2px;padding:8px 8px 0}
.ed-top .icon-btn{color:var(--nt2)}
.ed-content{padding:0 16px}
#edTitle{width:100%;border:none;background:none;outline:none;font:inherit;font-size:20px;font-weight:500;
  color:var(--nt);padding:12px 0 8px}
#edBody{width:100%;border:none;background:none;outline:none;font:inherit;font-size:14px;line-height:1.55;
  color:var(--nt);resize:none;min-height:150px;overflow:hidden}
.ed-chip{margin-top:10px}
.ed-item{display:flex;gap:12px;align-items:flex-start}
.ed-check{width:30px;height:30px;border:none;background:none;color:var(--nt);border-radius:50%;
  display:grid;place-items:center;flex:none;margin-top:2px}
.ed-check:hover{background:var(--hover)}
.ed-check .ms{font-size:19px}
.ed-item input{flex:1;min-width:0;border:none;background:none;outline:none;font:inherit;font-size:14px;
  color:var(--nt);padding:7px 0}
.ed-item.done input{text-decoration:line-through;color:var(--nt2)}
.ed-del{width:28px;height:28px;border:none;background:none;color:var(--nt2);border-radius:50%;
  display:grid;place-items:center;opacity:0;flex:none;margin-top:4px}
.ed-item:hover .ed-del{opacity:1}
.ed-del:hover{background:var(--hover)}
.ed-del .ms{font-size:17px}
.ed-add-item{display:flex;align-items:center;gap:12px;border:none;background:none;color:var(--nt2);
  font-size:14px;padding:8px 0;border-radius:4px}
.ed-add-item:hover{background:var(--hover)}
.ed-footer{display:flex;align-items:center;padding:8px 10px 10px}
.ed-footer .icon-btn{color:var(--nt2)}
.ed-footer-right{margin-left:auto}

/* ============ Popover ============ */
#popover{position:fixed;z-index:200;background:var(--pop-bg);border-radius:8px;box-shadow:var(--sh2);
  padding:8px 0;min-width:216px;max-width:320px;max-height:72vh;overflow-y:auto;animation:edIn .13s ease}
.pop-item{display:flex;align-items:center;gap:14px;width:100%;padding:9px 16px;border:none;background:none;
  font:inherit;font-size:14px;color:var(--text);text-align:left}
.pop-item:hover{background:var(--hover)}
.pop-item .ms{font-size:20px;color:var(--text2);flex:none}
.pop-head{padding:10px 16px 6px;font-weight:700;font-size:14px}
.pop-note{padding:8px 16px 4px;font-size:12px;color:var(--text2)}
.pop-sep{height:1px;background:var(--line);margin:6px 0}
.pop-input{width:calc(100% - 32px);margin:6px 16px;padding:8px 10px;border:1px solid var(--line);
  border-radius:6px;background:none;color:var(--text);font:inherit;font-size:14px;outline:none}
.pop-input:focus{border-color:var(--text2)}
.pop-inputs{display:flex;gap:8px;padding:8px 16px}
.pop-inputs input{flex:1;min-width:0;padding:7px 8px;border:1px solid var(--line);border-radius:6px;
  background:none;color:var(--text);font:inherit;font-size:13px;outline:none}
.pop-actions{display:flex;justify-content:flex-end;gap:4px;padding:4px 8px 6px}
.pop-row{display:flex;align-items:center;gap:2px;padding:2px 8px 2px 16px}
.pop-row-name{flex:1;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:6px 0}
.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:10px 16px}
.swatch{width:30px;height:30px;border-radius:50%;border:1px solid rgba(0,0,0,.12);display:grid;
  place-items:center;transition:transform .12s}
.swatch:hover{transform:scale(1.12)}
.swatch.sel{outline:2px solid var(--text2);outline-offset:2px}
.swatch .ms{font-size:17px;color:#202124}

/* ============ Toast ============ */
#toast{position:fixed;left:24px;bottom:24px;z-index:300;background:var(--toast-bg);color:var(--toast-fg);
  padding:8px 8px 8px 18px;border-radius:8px;box-shadow:var(--sh2);display:flex;align-items:center;
  gap:14px;font-size:14px;max-width:min(92vw,520px);animation:toastIn .2s ease}
@keyframes toastIn{from{opacity:0;transform:translateY(14px)}to{opacity:1}}
#toast .text-btn{color:var(--toast-act)}

/* ============ Responsive ============ */
@media (max-width:768px){
  #sidebar{transform:translateX(-105%);width:256px!important;transition:transform .2s ease;box-shadow:none}
  body.sb-open #sidebar{transform:none;box-shadow:var(--sh2)}
  body.sb-collapsed #main,#main{margin-left:0!important}
  #scrimSide{display:none;position:fixed;inset:0;background:var(--scrim);z-index:70}
  body.sb-open #scrimSide{display:block}
  .brand-name{display:none}
  .tb-search{margin:0 6px}
  .main-inner{padding:16px 14px 120px}
}
</style>
</head>
<body>

<header id="topbar">
  <div class="tb-left">
    <button id="menuBtn" class="icon-btn" title="Menu principal"><span class="ms">menu</span></button>
    <div class="brand"><span class="ms fill">lightbulb</span><span class="brand-name">Keep</span></div>
  </div>
  <div class="tb-search">
    <span class="ms">search</span>
    <input id="searchInput" placeholder="Rechercher" autocomplete="off">
    <button id="searchClear" class="icon-btn hidden" title="Effacer"><span class="ms">close</span></button>
  </div>
  <div class="tb-right">
    <button id="viewToggle" class="icon-btn"></button>
    <button id="themeToggle" class="icon-btn"></button>
    <button id="profileBtn" class="avatar" title="Compte">C</button>
  </div>
</header>

<nav id="sidebar"></nav>
<div id="scrimSide"></div>

<main id="main">
  <div class="main-inner">
    <div id="viewHead"></div>
    <div id="composerBox"></div>
    <div id="gridArea"></div>
  </div>
</main>

<div id="editorScrim" class="hidden">
  <div id="editor"></div>
</div>

<div id="popover" class="hidden"></div>
<div id="toast" class="hidden"></div>
<input type="file" id="fileInput" accept="image/*" hidden>

<script>
'use strict';
/* ================= Utilitaires ================= */
const $=s=>document.querySelector(s);
const el=(t,c,txt)=>{const e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e};
const icon=(n,f)=>{const s=el('span','ms'+(f?' fill':''));s.textContent=n;return s};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=v=>String(v).padStart(2,'0');
const debounce=(fn,t)=>{let h;return(...a)=>{clearTimeout(h);h=setTimeout(()=>fn(...a),t)}};
const fmtDay=new Intl.DateTimeFormat('fr-FR',{day:'numeric',month:'short'});
const fmtTime=new Intl.DateTimeFormat('fr-FR',{hour:'2-digit',minute:'2-digit'});
const fmtDateTime=ts=>fmtDay.format(new Date(ts))+' · '+fmtTime.format(new Date(ts));
function reminderText(ts){
  const d=new Date(ts),now=new Date();
  const diff=(new Date(d.getFullYear(),d.getMonth(),d.getDate())-new Date(now.getFullYear(),now.getMonth(),now.getDate()))/864e5;
  const t=fmtTime.format(d);
  if(diff===0)return "Aujourd'hui, "+t;
  if(diff===1)return "Demain, "+t;
  return fmtDay.format(d)+', '+t;
}

/* ================= Couleurs ================= */
const COLORS=[['default','Défaut'],['red','Cerise'],['orange','Corail'],['yellow','Jaune'],
  ['green','Menthe'],['teal','Sarcelle'],['blue','Ciel'],['cerulean','Bleu'],
  ['purple','Lavande'],['pink','Rose'],['brown','Brun'],['gray','Gris']];
const LIGHT={default:'#ffffff',red:'#f28b82',orange:'#fbbc04',yellow:'#fff475',green:'#ccff90',teal:'#a7ffeb',
  blue:'#cbf0f8',cerulean:'#aecbfa',purple:'#d7aefb',pink:'#fdcfe8',brown:'#e6c9a8',gray:'#e8eaed'};
const DARK={default:'#252525',red:'#5c2b29',orange:'#5e3a12',yellow:'#574a19',green:'#3d4b22',teal:'#1f4a44',
  blue:'#234a56',cerulean:'#2b4559',purple:'#453260',pink:'#4e3042',brown:'#54432e',gray:'#3c4043'};
const colorCss=k=>(document.documentElement.dataset.theme==='dark'?DARK:LIGHT)[k];

/* ================= État ================= */
const LS_KEY='keep-clone-v1';
let state={notes:[],labels:[],view:'notes',search:'',listMode:false};
let draft=null, editingId=null, editorNote=null;
let pendingImageTarget=null, dragId=null, toastTimer=null;

const byId=id=>state.notes.find(n=>n.id===id);
const isDraftNote=n=>!state.notes.includes(n);

function save(){
  try{localStorage.setItem(LS_KEY,JSON.stringify({notes:state.notes,labels:state.labels,
    dark:document.documentElement.dataset.theme==='dark',listMode:state.listMode}))}
  catch(e){toast("Stockage local saturé : la note n'a pas pu être enregistrée.")}
}
function load(){
  try{const d=JSON.parse(localStorage.getItem(LS_KEY));
    if(d&&Array.isArray(d.notes)){state.notes=d.notes;state.labels=d.labels||[];
      state.listMode=!!d.listMode;if(d.dark)document.documentElement.dataset.theme='dark';return}
  }catch(e){}
  seed();
}

  const now=Date.now(),day=864e5;

    image:null,ar:null,created:now,edited:now,hideChecked:false},o);
  state.notes=[
    N({title:'Idées cadeaux — anniversaire de Léa',items:[

      content:'Priorités du trimestre :\n• Refonte du parcours d\u2019inscription\n• Mode hors-ligne pour l\u2019appli mobile\n• Temps de chargement < 2 s\n\nÀ redonner au bureau produit avant vendredi.',labels:['l1'],created:now-2*day}),
    N({title:'Ne pas oublier !',
      content:'Renouveler l\u2019abonnement de transport avant le 28.\nPenser à la photo pour la carte.',color:'red',pinned:true,created:now-day}),

        {text:'Épinards frais',done:true},{text:'Café en grains (torréfaction claire)',done:false},
        {text:'Citrons',done:false}],color:'green',labels:['l3'],created:now-4*day}),
    N({title:'Appeler le garage',

/* ================= Toast ================= */
function toast(msg,actionLabel,fn){
  clearTimeout(toastTimer);
  const t=$('#toast');t.innerHTML='';
  t.append(el('span','',msg));
  if(actionLabel){const b=el('button','text-btn',actionLabel);
    b.onclick=()=>{hideToast();fn&&fn()};t.append(b)}
  t.classList.remove('hidden');
  toastTimer=setTimeout(hideToast,5500);
}
function hideToast(){$('#toast').classList.add('hidden');clearTimeout(toastTimer)}

/* ================= Rendu global ================= */
function render(animate=true){renderSidebar();renderMain(animate);updateHeaderIcons()}

function updateHeaderIcons(){
  const vt=$('#viewToggle');vt.innerHTML='';
  vt.append(icon(state.listMode?'grid_view':'view_agenda'));
  vt.title=state.listMode?'Afficher en grille':'Afficher en liste';
  const tt=$('#themeToggle');tt.innerHTML='';
  tt.append(icon(document.documentElement.dataset.theme==='dark'?'light_mode':'dark_mode'));
  tt.title=document.documentElement.dataset.theme==='dark'?'Thème clair':'Thème sombre';
}

/* ================= Sidebar ================= */
function setView(v){
  state.view=v;state.search='';
  $('#searchInput').value='';$('#searchClear').classList.add('hidden');
  document.body.classList.remove('sb-open');
  render(true);
}
function navItem(view,ic,name){
  const d=el('div','nav-item'+(state.view===view?' active':''));
  d.append(icon(ic,state.view===view),el('span','nav-label-text',name));
  d.onclick=()=>setView(view);
  return d;
}
function renderSidebar(){
  const sb=$('#sidebar');sb.innerHTML='';
  sb.append(navItem('notes','lightbulb','Notes'),navItem('reminders','notifications','Rappels'));
  sb.append(el('div','nav-sep'),el('div','nav-section-title','Libellés'));
  state.labels.forEach(l=>sb.append(navItem('label:'+l.id,'label',l.name)));
  const edit=el('div','nav-item');edit.append(icon('edit'),el('span','nav-label-text','Modifier les libellés'));
  edit.onclick=e=>togglePop('manage',edit,p=>buildManager(p,edit));
  sb.append(edit,el('div','nav-sep'),navItem('archive','archive','Archive'),navItem('trash','delete','Corbeille'));
}

/* ================= Vue principale ================= */
const isLabelView=()=>state.view.startsWith('label:');
function currentNotes(){
  let list;
  switch(state.view){
    case 'notes':list=state.notes.filter(n=>!n.archived&&!n.trashed);break;
    case 'reminders':list=state.notes.filter(n=>n.reminder&&!n.trashed&&!n.archived)
      .sort((a,b)=>a.reminder-b.reminder);break;
    case 'archive':list=state.notes.filter(n=>n.archived&&!n.trashed);break;
    case 'trash':list=state.notes.filter(n=>n.trashed).sort((a,b)=>(b.trashedAt||0)-(a.trashedAt||0));break;
    default:const lid=state.view.slice(6);
      list=state.notes.filter(n=>n.labels.includes(lid)&&!n.archived&&!n.trashed);
  }
  if(state.search){const q=state.search.toLowerCase();
    list=list.filter(n=>(n.title||'').toLowerCase().includes(q)
      ||(n.content||'').toLowerCase().includes(q)
      ||(n.items||[]).some(it=>it.text.toLowerCase().includes(q)))}
  return list;
}

function renderMain(animate){
  const head=$('#viewHead'),compBox=$('#composerBox'),area=$('#gridArea');
  head.innerHTML='';compBox.innerHTML='';area.innerHTML='';
  const list=currentNotes(),q=state.search;
  const titles={reminders:'Rappels',archive:'Archive',trash:'Corbeille'};
  if(q){
    head.append(el('h1','view-title','Résultats de recherche'));
    head.append(el('p','view-sub',list.length+' note'+(list.length>1?'s':'')+' pour « '+q+' »'));
  }else if(titles[state.view]||isLabelView()){
    const t=titles[state.view]||(state.labels.find(l=>'label:'+l.id===state.view)||{}).name||'';
    head.append(el('h1','view-title',t));
    if(state.view==='trash')head.append(el('p','view-sub',
      'Les notes de la corbeille peuvent être restaurées ou supprimées définitivement.'));
    if(state.view==='trash'&&list.length){
      const b=el('button','text-btn danger trash-empty','Vider la corbeille');b.onclick=emptyTrash;head.append(b)}
  }
  if(!q&&(state.view==='notes'||state.view==='reminders'||isLabelView()))compBox.append(buildComposer());

  let pinned=[],rest=list;
  if(!q&&(state.view==='notes'||isLabelView())){pinned=list.filter(n=>n.pinned);rest=list.filter(n=>!n.pinned)}
  let any=false;
  if(pinned.length){area.append(el('h2','sec-title','Épinglées'));
    const g=el('div','masonry');g.id='gridPinned';area.append(g);
    layoutMasonry('gridPinned',pinned,animate);any=true}
  if(rest.length){if(pinned.length)area.append(el('h2','sec-title','Autres'));
    const g=el('div','masonry');g.id='gridRest';area.append(g);
    layoutMasonry('gridRest',rest,animate);any=true}
  if(!any)area.append(emptyState());
}

function emptyState(){
  const map={
    notes:['lightbulb','Les notes que vous ajoutez apparaissent ici.'],
    reminders:['notifications','Les notes avec rappel apparaissent ici.'],
    archive:['archive','Les notes archivées apparaissent ici.'],
    trash:['delete','Aucune note dans la corbeille.'],
    search:['search','Aucun résultat. Essayez d\u2019autres mots-clés.'],
    label:['label','Aucune note avec ce libellé.']};
  const k=state.search?'search':(map[state.view]?state.view:'label');
  const [ic,txt]=map[k];
  const d=el('div','empty');d.append(icon(ic),el('p','',txt));
  return d;
}

/* ================= Composer ================= */
function buildComposer(){
  const c=el('div');c.id='composer';
  const main=el('div','composer-main',state.view==='reminders'?'Créer un rappel…':'Prenez une note…');
  main.onclick=()=>openEditor(null);
  const right=el('div','composer-icons');
  const mk=(ic,title,quick)=>{const b=el('button','tool-btn');b.title=title;b.dataset.quick=quick;
    b.append(icon(ic));right.append(b)};
  mk('checklist','Nouvelle liste','list');mk('image','Image','image');
  c.append(main,right);
  return c;
}
function quick(kind){
  if(kind==='list')openEditor(null,'list');
  else if(kind==='image'){openEditor(null);pendingImageTarget='draft';$('#fileInput').click()}
}

/* ================= Masonry ================= */
function layoutMasonry(cid,notes,animate){
  const grid=document.getElementById(cid);grid.innerHTML='';
  const w=grid.parentElement.clientWidth;
  const cols=state.listMode?1:(w<520?1:w<840?2:w<1160?3:w<1500?4:5);
  grid.classList.toggle('list',state.listMode);
  const colEls=[],hs=[];
  for(let i=0;i<cols;i++){const c=el('div','mcol');grid.append(c);colEls.push(c);hs.push(0)}
  notes.forEach((n,i)=>{
    const card=noteCard(n,i,animate);
    let idx=0,min=Infinity;hs.forEach((h,j)=>{if(h<min){min=h;idx=j}});
    colEls[idx].append(card);hs[idx]+=card.offsetHeight+16;
  });
}

/* ================= Carte note ================= */
function tool(name,title,act){
  const b=el('button','tool-btn');b.title=title;b.dataset.act=act;b.append(icon(name));return b;
}
function noteCard(n,i,animate){
  const tv=state.view==='trash';
  const c=el('article','note-card nc-'+n.color+(animate?' anim':''));
  c.dataset.id=n.id;c.style.animationDelay=Math.min(i*30,300)+'ms';
  if(!tv)c.draggable=true;
  if(n.reminder){
    const chip=el('div','nc-reminder');
    chip.append(icon('alarm',true),el('span','',reminderText(n.reminder)));
    if(!tv){const x=el('button','chip-x');x.title='Supprimer le rappel';x.dataset.act='unreminder';
      x.append(icon('close'));chip.append(x)}
    c.append(chip);
  }
  if(!tv){
    const pin=el('button','nc-pin'+(n.pinned?' pinned':''));
    pin.title=n.pinned?'Désépingler':'Épingler';pin.dataset.act='pin';
    pin.append(icon('push_pin',n.pinned));c.append(pin);
  }
  if(n.image){const w=el('div','nc-image');w.style.setProperty('--ar',n.ar||'4 / 3');
    const im=el('img');im.src=n.image;im.alt='';im.loading='lazy';w.append(im);c.append(w)}
  if(n.title)c.append(el('div','nc-title',n.title));
  if(n.items){
    const list=el('div','nc-list');
    let shown=n.items.map((it,idx)=>({it,idx}));
    if(n.hideChecked)shown=shown.filter(s=>!s.it.done);
    shown.forEach(({it,idx})=>{
      const r=el('div','nc-li'+(it.done?' done':''));
      const b=el('button','nc-check');b.title=it.done?'Décocher':'Cocher';
      b.dataset.act='check';b.dataset.idx=idx;
      b.append(icon(it.done?'check_box':'check_box_outline_blank',it.done));
      r.append(b,el('span','',it.text));list.append(r);
    });
    if(n.hideChecked){const dc=n.items.filter(x=>x.done).length;
      if(dc)list.append(el('div','nc-hidden-count',dc+' élément'+(dc>1?'s':'')+' coché'+(dc>1?'s':'')))}
    c.append(list);
  }else if(n.content)c.append(el('div','nc-body',n.content));
  if(n.labels.length){const lw=el('div','nc-labels');
    n.labels.forEach(lid=>{const l=state.labels.find(x=>x.id===lid);
      if(l)lw.append(el('span','chip-label',l.name))});
    c.append(lw)}
  if(tv){
    const f=el('div','nc-trash-actions');
    const r1=el('button','text-btn','Restaurer');r1.dataset.act='restore';
    const r2=el('button','text-btn danger','Supprimer définitivement');r2.dataset.act='purge';
    f.append(r1,r2);c.append(f);
  }else{
    const f=el('div','nc-tools');
    f.append(tool('add_alarm','Rappel','reminder'),tool('image','Image','image'),
      tool('palette','Couleur','color'),
      tool(n.archived?'unarchive':'archive',n.archived?'Désarchiver':'Archiver','archive'),
      tool('more_vert','Plus','more'));
    c.append(f);
  }
  return c;
}

/* ================= Actions sur les notes ================= */
function trashNote(id){
  const n=byId(id);if(!n)return;
  n.trashed=true;n.trashedAt=Date.now();n.pinned=false;
  save();render(false);
  toast('Note placée dans la corbeille','Annuler',()=>{n.trashed=false;n.trashedAt=null;save();render(false)});
}
function purgeNote(id){
  const i=state.notes.findIndex(n=>n.id===id);if(i<0)return;
  const [n]=state.notes.splice(i,1);save();render(false);
  toast('Note supprimée définitivement','Annuler',()=>{
    state.notes.splice(Math.min(i,state.notes.length),0,n);save();render(false)});
}
function emptyTrash(){
  const victims=state.notes.filter(n=>n.trashed);if(!victims.length)return;
  const backup=state.notes.map((n,i)=>({n,i}));
  state.notes=state.notes.filter(n=>!n.trashed);save();render(false);
  toast(victims.length+' note'+(victims.length>1?'s':'')+' supprimée'+(victims.length>1?'s':'')+' définitivement',
    'Annuler',()=>{const r=state.notes.slice();
      backup.forEach(({n,i})=>r.splice(Math.min(i,r.length),0,n));
      state.notes=r;save();render(false)});
}
function archiveToggle(id){
  const n=byId(id);if(!n)return;
  n.archived=!n.archived;if(n.archived)n.pinned=false;
  save();render(false);
  toast(n.archived?'Note archivée':'Note retirée des archives','Annuler',
    ()=>{n.archived=!n.archived;save();render(false)});
}
function duplicateNote(id){
  const n=byId(id);if(!n)return;
  const c=JSON.parse(JSON.stringify(n));
  c.id=uid();c.created=c.edited=Date.now();c.reminder=null;c.reminderFired=false;c.pinned=false;
  state.notes.unshift(c);save();render(true);toast('Note dupliquée');
}
function convertChecklist(n){
  if(n.items){n.content=n.items.map(it=>it.text).join('\n');n.items=null}
  else{n.items=(n.content?n.content.split('\n'):[]).map(t=>({text:t,done:false}));
    if(!n.items.length)n.items=[{text:'',done:false}];n.content=''}
  n.edited=Date.now();save();render(false);
  if(editorNote===n)rebuildEditorContent(n);
}
function createLabel(name){
  const ex=state.labels.find(l=>l.name.toLowerCase()===name.toLowerCase());
  if(ex)return ex;
  const l={id:uid(),name};state.labels.push(l);save();return l;
}

function handleAct(act,id,btn){
  const n=byId(id);if(!n)return;
  switch(act){
    case 'pin':n.pinned=!n.pinned;n.edited=Date.now();save();render(false);break;
    case 'check':{const it=n.items[+btn.dataset.idx];it.done=!it.done;save();render(false);break}
    case 'unreminder':n.reminder=null;n.reminderFired=false;save();render();
      toast('Rappel supprimé');break;
    case 'image':pendingImageTarget=id;$('#fileInput').click();break;
    case 'color':togglePop('color:'+id,btn,p=>buildPalette(p,id));break;
    case 'reminder':togglePop('rem:'+id,btn,p=>buildReminder(p,id));break;
    case 'archive':archiveToggle(id);break;
    case 'restore':n.trashed=false;n.trashedAt=null;save();render(false);toast('Note restaurée');break;
    case 'purge':purgeNote(id);break;
    case 'more':togglePop('more:'+id,btn,p=>buildMenu(p,id));break;
  }
}

/* ================= Popover ================= */
const pop=$('#popover');
function openPopover(anchor,build){
  pop.innerHTML='';build(pop);pop.classList.remove('hidden');
  const r=anchor.getBoundingClientRect();
  let x=r.left,y=r.bottom+6;
  if(x+pop.offsetWidth>innerWidth-8)x=innerWidth-8-pop.offsetWidth;
  if(x<8)x=8;
  if(y+pop.offsetHeight>innerHeight-8)y=Math.max(8,r.top-pop.offsetHeight-6);
  pop.style.left=x+'px';pop.style.top=y+'px';
  setTimeout(()=>document.addEventListener('pointerdown',outsideClose),0);
}
function closePopover(){pop.classList.add('hidden');pop.innerHTML='';pop.dataset.anchor='';
  document.removeEventListener('pointerdown',outsideClose)}
function outsideClose(e){if(!pop.contains(e.target))closePopover()}
function togglePop(key,anchor,build){
  if(pop.dataset.anchor===key&&!pop.classList.contains('hidden')){closePopover();return}
  pop.dataset.anchor=key;openPopover(anchor,build);
}
function popItem(p,ic,label,fn){
  const b=el('button','pop-item');b.append(icon(ic),el('span','',label));b.onclick=fn;p.append(b);return b;
}

function buildPalette(p,id){
  const n=byId(id);const g=el('div','swatches');
  COLORS.forEach(([k,name])=>{
    const s=el('button','swatch'+(n.color===k?' sel':''));s.title=name;s.style.background=colorCss(k);
    if(n.color===k)s.append(icon('check',true));
    s.onclick=()=>{n.color=k;n.edited=Date.now();save();closePopover();render(false);
      if(editorNote===n)$('#editor').className='nc-'+k};
    g.append(s);
  });
  p.append(g);
}

function buildMenu(p,id){
  const n=byId(id);
  if(state.view==='trash'){
    popItem(p,'restore_from_trash','Restaurer',()=>{closePopover();
      n.trashed=false;n.trashedAt=null;save();render(false);toast('Note restaurée')});
    popItem(p,'delete_forever','Supprimer définitivement',()=>{closePopover();purgeNote(id)});
    return;
  }
  popItem(p,'label','Ajouter un libellé',()=>buildLabelsPicker(p,id));
  if(n.items)popItem(p,'checklist','Masquer les cases à cocher',()=>{closePopover();convertChecklist(n)});
  else popItem(p,'checklist','Afficher les cases à cocher',()=>{closePopover();convertChecklist(n)});
  if(n.items)popItem(p,n.hideChecked?'visibility':'visibility_off',
    n.hideChecked?'Afficher les éléments cochés':'Masquer les éléments cochés',
    ()=>{closePopover();n.hideChecked=!n.hideChecked;save();render(false)});
  popItem(p,'content_copy','Dupliquer la note',()=>{closePopover();duplicateNote(id)});
  popItem(p,'delete','Supprimer la note',()=>{closePopover();trashNote(id)});
  p.append(el('div','pop-note','Modifié le '+fmtDateTime(n.edited)));
}

function buildLabelsPicker(p,id){
  p.innerHTML='';
  const back=el('button','pop-item');back.append(icon('arrow_back'),el('span','','Modifier les libellés'));
  back.onclick=()=>buildMenu(p,id);p.append(back);
  p.append(el('div','pop-sep'));
  const n=byId(id);
  state.labels.forEach(l=>{
    const has=n.labels.includes(l.id);
    const b=el('button','pop-item');
    b.append(icon(has?'check_box':'check_box_outline_blank',has),el('span','',l.name));
    b.onclick=()=>{n.labels=has?n.labels.filter(x=>x!==l.id):[...n.labels,l.id];
      n.edited=Date.now();save();render(false);buildLabelsPicker(p,id)};
    p.append(b);
  });
  const inp=el('input','pop-input');inp.placeholder='Créer un libellé';
  inp.onkeydown=e=>{if(e.key==='Enter'&&inp.value.trim()){createLabel(inp.value.trim());
    renderSidebar();buildLabelsPicker(p,id)}};
  p.append(inp);
}

function buildManager(p,anchor){
  p.innerHTML='';p.append(el('div','pop-head','Modifier les libellés'));
  state.labels.forEach(l=>{
    const row=el('div','pop-row');
    const name=el('span','pop-row-name',l.name);
    const edit=el('button','mini-btn');edit.title='Renommer';edit.append(icon('edit'));
    edit.onclick=()=>{
      row.innerHTML='';
      const inp=el('input','pop-input');inp.value=l.name;inp.style.margin='0';
      const ok=el('button','mini-btn');ok.append(icon('check'));
      const done=()=>{const v=inp.value.trim();if(v)l.name=v;save();render();buildManager(p,anchor)};
      ok.onclick=done;
      inp.onkeydown=e=>{if(e.key==='Enter')done();if(e.key==='Escape')buildManager(p,anchor)};
      row.append(inp,ok);inp.focus();inp.select();
    };
    const del=el('button','mini-btn');del.title='Supprimer';del.append(icon('delete'));
    del.onclick=()=>{
      state.labels=state.labels.filter(x=>x!==l);
      state.notes.forEach(nn=>nn.labels=nn.labels.filter(x=>x!==l.id));
      if(state.view==='label:'+l.id)state.view='notes';
      save();render();buildManager(p,anchor);
    };
    row.append(name,edit,del);p.append(row);
  });
  if(!state.labels.length)p.append(el('div','pop-note','Aucun libellé pour le moment.'));
  const inp=el('input','pop-input');inp.placeholder='Créer un libellé';
  inp.onkeydown=e=>{if(e.key==='Enter'&&inp.value.trim()){createLabel(inp.value.trim());
    render();buildManager(p,anchor)}};
  p.append(inp);
}

function buildReminder(p,id){
  const n=byId(id);
  p.append(el('div','pop-head','Rappel'));
  const setRem=ts=>{n.reminder=ts;n.reminderFired=false;save();closePopover();render(false);
    if(editorNote===n)rebuildEditorContent(n)};
  popItem(p,'schedule','Demain, 08:00',()=>{
    const d=new Date(Date.now()+864e5);d.setHours(8,0,0,0);setRem(d.getTime())});
  popItem(p,'schedule','La semaine prochaine, 08:00',()=>{
    const d=new Date();const add=(8-d.getDay())%7||7;d.setDate(d.getDate()+add);
    d.setHours(8,0,0,0);setRem(d.getTime())});
  const row=el('div','pop-inputs');
  const di=el('input');di.type='date';const ti=el('input');ti.type='time';
  if(n.reminder){const d=new Date(n.reminder);
    di.value=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
    ti.value=pad(d.getHours())+':'+pad(d.getMinutes())}
  row.append(di,ti);p.append(row);
  const acts=el('div','pop-actions');
  if(n.reminder){const del=el('button','text-btn danger','Supprimer');
    del.onclick=()=>{n.reminder=null;n.reminderFired=false;save();closePopover();render(false);
      if(editorNote===n)rebuildEditorContent(n)};acts.append(del)}
  const ok=el('button','text-btn','Enregistrer');
  ok.onclick=()=>{
    if(!di.value||!ti.value){toast('Choisissez une date et une heure.');return}
    const [Y,M,D]=di.value.split('-').map(Number),[h,m]=ti.value.split(':').map(Number);
    setRem(new Date(Y,M-1,D,h,m).getTime());
  };
  acts.append(ok);p.append(acts);
}

function buildProfile(p){
  p.innerHTML='';
  const row=el('div','pop-row');row.style.padding='10px 16px';
  const av=el('div','avatar');av.style.cssText='width:44px;height:44px;font-size:18px;flex:none';
  av.append(document.createTextNode('C'));
  const col=el('div');col.style.marginLeft='6px';
  col.append(el('div','',el('b','','Camille Martin').textContent),el('div','pop-note','camille@exemple.fr'));
  row.append(av,col);p.append(row);
  const size=((new Blob([localStorage.getItem(LS_KEY)||'']).size)/1024).toFixed(1);
  p.append(el('div','pop-note','Clone hors-ligne — données stockées dans ce navigateur ('+size+' Ko).'));
  p.append(el('div','pop-sep'));
  const reset=el('button','pop-item');reset.append(icon('restart_alt'),el('span','','Réinitialiser les données'));
  let armed=false;
  reset.onclick=()=>{
    if(!armed){armed=true;reset.querySelector('span').textContent='Confirmer la réinitialisation';
      reset.style.color='var(--danger)';return}
    localStorage.removeItem(LS_KEY);seed();closePopover();render(true);toast('Données réinitialisées');
  };
  p.append(reset);
}

/* ================= Éditeur ================= */
function openEditor(id,mode){
  closePopover();
  let n=id?byId(id):null;
  if(!n){
    n={id:uid(),title:'',content:'',
      items:mode==='list'?[{text:'',done:false}]:null,
      color:'default',pinned:false,archived:false,trashed:false,trashedAt:null,labels:[],
      reminder:null,reminderFired:false,image:null,ar:null,created:Date.now(),edited:Date.now(),hideChecked:false};
    if(state.view==='reminders'){const d=new Date(Date.now()+864e5);d.setHours(8,0,0,0);n.reminder=d.getTime()}
    draft=n;
  }
  editingId=id||null;
  buildEditor(n);
  $('#editorScrim').classList.remove('hidden');
  requestAnimationFrame(()=>{const t=$('#edTitle');if(t)t.focus()});
}

function buildEditor(n){
  editorNote=n;
  const ed=$('#editor');ed.className='nc-'+n.color;ed.innerHTML='';
  if(n.image){
    const w=el('div','ed-img');const im=el('img');im.src=n.image;
    if(n.ar)im.style.aspectRatio=n.ar;
    const x=el('button','ed-img-x');x.title="Supprimer l'image";x.append(icon('close'));
    x.onclick=()=>{n.image=null;n.ar=null;w.remove();if(!isDraftNote(n))save();render(false)};
    w.append(im,x);ed.append(w);
  }
  const top=el('div','ed-top');
  const mk=(name,title,fn)=>{const b=el('button','icon-btn'+(name==='push_pin'&&n.pinned?' on':''));
    b.title=title;b.append(icon(name,name==='push_pin'&&n.pinned));b.onclick=fn;return b};
  const pin=mk('push_pin',n.pinned?'Désépingler':'Épingler',()=>{
    n.pinned=!n.pinned;save();render(false);
    pin.classList.toggle('on',n.pinned);
    const ic=pin.querySelector('.ms');ic.classList.toggle('fill',n.pinned);
  });
  const palBtn=mk('palette','Modifier la couleur',()=>togglePop('ed-color',palBtn,p=>buildPalette(p,n.id)));
  const archBtn=mk(n.archived?'unarchive':'archive',n.archived?'Désarchiver':'Archiver',
    ()=>commitAndClose(nn=>archiveToggle(nn.id)));
  const delBtn=mk('delete','Mettre à la corbeille',()=>commitAndClose(nn=>trashNote(nn.id)));
  const moreBtn=mk('more_vert','Plus',()=>togglePop('ed-more',moreBtn,p=>buildMenu(p,n.id)));
  top.append(pin,palBtn,archBtn,delBtn,moreBtn);ed.append(top);

  const content=el('div','ed-content');content.id='edContent';
  ed.append(content);
  fillEditorContent(content,n);

  const foot=el('div','ed-footer');
  const left=el('div');
  const remBtn=mk('add_alarm','Rappel',()=>togglePop('ed-rem',remBtn,p=>buildReminder(p,n.id)));
  const imgBtn=mk('image','Image',()=>{
    pendingImageTarget=isDraftNote(n)?'draft':n.id;$('#fileInput').click()});
  left.append(remBtn,imgBtn);
  const closeB=el('button','text-btn','Fermer');closeB.onclick=closeEditor;
  const right=el('div','ed-footer-right');right.append(closeB);
  foot.append(left,right);ed.append(foot);
}

function fillEditorContent(container,n){
  container.innerHTML='';
  if(n.reminder){
    const chip=el('div','nc-reminder ed-chip');
    chip.append(icon('alarm',true),el('span','',reminderText(n.reminder)));
    const x=el('button','chip-x');x.title='Supprimer le rappel';x.append(icon('close'));
    x.onclick=()=>{n.reminder=null;n.reminderFired=false;save();render(false);
      if(editorNote===n)rebuildEditorContent(n)};
    chip.append(x);container.append(chip);
  }
  const t=el('input');t.id='edTitle';t.placeholder='Titre';t.value=n.title;
  t.oninput=()=>{n.title=t.value;touchSave(n)};
  container.append(t);
  if(n.items){
    const list=el('div');list.id='edItems';
    n.items.forEach(it=>list.append(itemRow(n,it)));
    const add=el('button','ed-add-item');add.append(icon('add'),el('span','','Élément de liste'));
    add.onclick=()=>{const r=itemRow(n,{text:'',done:false});list.append(r);
      r.querySelector('input').focus()};
    container.append(list,add);
  }else{
    const b=el('textarea');b.id='edBody';b.placeholder='Prenez une note…';b.value=n.content;
    b.oninput=()=>{n.content=b.value;autosize(b);touchSave(n)};
    container.append(b);
    requestAnimationFrame(()=>autosize(b));
  }
}
function rebuildEditorContent(n){
  const old=$('#edContent');if(!old)return;
  const c=el('div','ed-content');c.id='edContent';
  fillEditorContent(c,n);old.replaceWith(c);
}
function itemRow(n,it){
  const r=el('div','ed-item'+(it.done?' done':''));
  const cb=el('button','ed-check');cb.title=it.done?'Décocher':'Cocher';
  cb.append(icon(it.done?'check_box':'check_box_outline_blank',it.done));
  cb.onclick=()=>{r.classList.toggle('done');
    const d=r.classList.contains('done');
    cb.innerHTML='';cb.append(icon(d?'check_box':'check_box_outline_blank',d));
    n.items=readEdItems();touchSave(n)};
  const inp=el('input');inp.value=it.text;inp.placeholder='Élément de liste';
  inp.oninput=()=>{n.items=readEdItems();touchSave(n)};
  inp.onkeydown=e=>{
    if(e.key==='Enter'){e.preventDefault();
      if(!inp.value.trim())return;
      const nr=itemRow(n,{text:'',done:false});r.after(nr);
      n.items=readEdItems();touchSave(n);nr.querySelector('input').focus()}
    if(e.key==='Backspace'&&inp.value===''){
      const rows=[...$('#edItems').querySelectorAll('.ed-item')];
      if(rows.length<2)return;
      e.preventDefault();
      const prev=r.previousElementSibling,next=r.nextElementSibling;
      r.remove();n.items=readEdItems();touchSave(n);
      (prev||next)&&((prev||next).querySelector('input').focus());
    }
  };
  const del=el('button','ed-del');del.title='Supprimer cet élément';del.append(icon('close'));
  del.onclick=()=>{r.remove();n.items=readEdItems();touchSave(n)};
  r.append(cb,inp,del);
  return r;
}
function readEdItems(){
  return [...document.querySelectorAll('#edItems .ed-item')]
    .map(r=>({text:r.querySelector('input').value,done:r.classList.contains('done')}));
}
function autosize(t){t.style.height='auto';t.style.height=Math.max(150,t.scrollHeight)+'px'}
function touchSave(n){n.edited=Date.now();if(!isDraftNote(n))save()}
function isEmptyNote(n){return !n.title.trim()&&!n.content.trim()
  &&!(n.items&&n.items.some(it=>it.text.trim()))&&!n.image}

function syncEditor(n){
  const t=$('#edTitle');if(!t)return;
  n.title=t.value;
  const b=$('#edBody');if(b)n.content=b.value;
  const list=$('#edItems');if(list)n.items=readEdItems();
}
function commitEditor(){
  let n=editingId?byId(editingId):draft;
  if(!n)return null;
  syncEditor(n);
  if(isEmptyNote(n)){
    if(editingId){const i=state.notes.indexOf(n);
      if(i>-1)state.notes.splice(i,1);save();render(false)}
    return null;
  }
  if(n.items){n.items=n.items.filter(it=>it.text.trim()!=='');if(!n.items.length)n.items=null}
  if(!editingId&&draft){state.notes.unshift(draft);editingId=draft.id;draft=null}
  n.edited=Date.now();save();render(false);
  return n;
}
function commitAndClose(fn){const nn=commitEditor();finishEditor();if(nn)fn(nn)}
function closeEditor(){commitEditor();finishEditor()}
function finishEditor(){editingId=null;draft=null;editorNote=null;
  $('#editorScrim').classList.add('hidden');$('#editor').innerHTML=''}

/* ================= Images ================= */
 $('#fileInput').addEventListener('change',e=>{
  const f=e.target.files[0];e.target.value='';
  if(!f||!f.type.startsWith('image/'))return;
  const img=new Image();
  img.onload=()=>{
    const max=1000,s=Math.min(1,max/Math.max(img.width,img.height));
    const w=Math.max(1,Math.round(img.width*s)),h=Math.max(1,Math.round(img.height*s));
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;
    cv.getContext('2d').drawImage(img,0,0,w,h);
    applyImage(cv.toDataURL('image/jpeg',.82),w+' / '+h);
    URL.revokeObjectURL(img.src);
  };
  img.src=URL.createObjectURL(f);
});
function applyImage(data,ar){
  const t=pendingImageTarget==='draft'?draft:byId(pendingImageTarget);
  pendingImageTarget=null;
  if(!t)return;
  t.image=data;t.ar=ar;t.edited=Date.now();
  if(!isDraftNote(t))save();
  if(editorNote===t){
    $('#editor').querySelector('.ed-img')?.remove();
    const w=el('div','ed-img');const im=el('img');im.src=data;im.style.aspectRatio=ar;
    const x=el('button','ed-img-x');x.title="Supprimer l'image";x.append(icon('close'));
    x.onclick=()=>{t.image=null;t.ar=null;w.remove();if(!isDraftNote(t))save();render(false)};
    w.append(im,x);$('#editor').prepend(w);
  }else render(false);
}

/* ================= Drag & drop ================= */
const gridArea=$('#gridArea');
gridArea.addEventListener('dragstart',e=>{
  const card=e.target.closest('.note-card');if(!card)return;
  dragId=card.dataset.id;card.classList.add('dragging');
  e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragId);
});
gridArea.addEventListener('dragover',e=>{
  if(!dragId)return;
  gridArea.querySelectorAll('.drop-before,.drop-after')
    .forEach(x=>x.classList.remove('drop-before','drop-after'));
  const card=e.target.closest('.note-card');
  if(!card||card.dataset.id===dragId)return;
  e.preventDefault();e.dataTransfer.dropEffect='move';
  const r=card.getBoundingClientRect();
  card.classList.add(e.clientY<r.top+r.height/2?'drop-before':'drop-after');
});
gridArea.addEventListener('drop',e=>{
  if(!dragId)return;
  const card=e.target.closest('.note-card');
  if(card&&card.dataset.id!==dragId){
    e.preventDefault();
    const before=card.classList.contains('drop-before');
    const from=state.notes.findIndex(n=>n.id===dragId);
    const [m]=state.notes.splice(from,1);
    let to=state.notes.findIndex(n=>n.id===card.dataset.id);
    if(!before)to++;
    state.notes.splice(to,0,m);
    save();render(false);
  }
  clearDrag();
});
gridArea.addEventListener('dragend',clearDrag);
function clearDrag(){dragId=null;
  gridArea.querySelectorAll('.dragging,.drop-before,.drop-after')
    .forEach(x=>x.classList.remove('dragging','drop-before','drop-after'))}

/* ================= Délégation des clics (notes + composer) ================= */
 $('#main').addEventListener('click',e=>{
  const q=e.target.closest('[data-quick]');
  if(q){quick(q.dataset.quick);return}
  const b=e.target.closest('[data-act]');
  if(b){const card=b.closest('.note-card');
    if(card)handleAct(b.dataset.act,card.dataset.id,b);return}
  const card=e.target.closest('.note-card');
  if(card){
    if(state.view==='trash')toast('Restaurez la note pour la modifier.');
    else openEditor(card.dataset.id);
  }
});

/* ================= Rappels ================= */
function checkReminders(){
  const now=Date.now();let changed=false;
  state.notes.forEach(n=>{
    if(n.reminder&&n.reminder<=now&&!n.reminderFired&&!n.trashed){
      n.reminderFired=true;changed=true;
      toast('Rappel — '+(n.title||'Note sans titre'),'Ouvrir',()=>{
        if(n.trashed)return;state.view='notes';openEditor(n.id)});
    }
  });
  if(changed)save();
}

/* ================= Header & global ================= */
 $('#menuBtn').onclick=()=>{
  if(matchMedia('(max-width:768px)').matches)document.body.classList.toggle('sb-open');
  else document.body.classList.toggle('sb-collapsed');
};
 $('#scrimSide').onclick=()=>document.body.classList.remove('sb-open');
 $('#searchInput').addEventListener('input',e=>{
  state.search=e.target.value.trim();
  $('#searchClear').classList.toggle('hidden',!state.search);
  render(false);
});
 $('#searchClear').onclick=()=>{
  state.search='';$('#searchInput').value='';$('#searchClear').classList.add('hidden');
  render(false);$('#searchInput').focus();
};
 $('#viewToggle').onclick=()=>{state.listMode=!state.listMode;save();render(false)};
 $('#themeToggle').onclick=()=>{
  const html=document.documentElement;
  html.dataset.theme=html.dataset.theme==='dark'?'light':'dark';
  save();updateHeaderIcons();
};
 $('#profileBtn').onclick=e=>togglePop('profile',e.currentTarget,buildProfile);

 $('#editorScrim').addEventListener('click',e=>{if(e.target.id==='editorScrim')closeEditor()});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(pop.dataset.anchor&&!pop.classList.contains('hidden'))closePopover();
    else if(!$('#editorScrim').classList.contains('hidden'))closeEditor();
    else document.body.classList.remove('sb-open');
  }
  if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){
    e.preventDefault();$('#searchInput').focus()}
});
window.addEventListener('resize',debounce(()=>render(false),150));

/* ================= Init ================= */
load();
render(true);
checkReminders();
setInterval(checkReminders,20000);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>render(false));
</script>
